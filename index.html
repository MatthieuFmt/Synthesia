<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Synthesia Web — Apprentissage du piano</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Conteneur pivotable : sert de cible à la rotation CSS du mode paysage
         de secours (cf. body.force-landscape dans style.css). -->
    <div class="app">
    <header class="topbar">
      <!-- =====================================================================
           Barre commune : présente quelle que soit la fonctionnalité active
           (retour à l'accueil, nom du mode, paysage, plein écran).
           ================================================================== -->
      <div class="appbar">
        <button id="homeBtn" class="btn home-btn" type="button" hidden
          aria-label="Revenir à l'accueil" title="Revenir à l'accueil">
          <svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19 12H5m0 0 6-6m-6 6 6 6" />
          </svg>
          <span class="home-btn-label">Accueil</span>
        </button>

        <span id="featureTitle" class="feature-title">Accueil</span>

        <button id="landscapeBtn" class="btn icon-btn landscape-btn" type="button"
          aria-label="Passer en mode paysage" title="Passer en mode paysage">
          <svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M23 4v6h-6" />
            <path d="M20.5 15a9 9 0 1 1 2.2-9.5" />
          </svg>
        </button>

        <button
          id="fullscreenBtn"
          class="btn fullscreen-btn"
          type="button"
          aria-label="Passer en plein écran"
          title="Passer en plein écran"
        >
          <svg
            class="fullscreen-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path d="M8 3H3v5M16 3h5v5M21 16v5h-5M8 21H3v-5" />
          </svg>
        </button>
      </div>

      <!-- =====================================================================
           Contrôles propres au mode Morceau : bibliothèque, notation, vitesse
           et transport. Affichés par song-mode.js pendant que le mode est
           actif, masqués dès son arrêt.
           ================================================================== -->
      <div id="songControls" class="mode-controls" hidden>
        <div class="controls">
          <select id="songSelect" class="song-select">
            <option value="">Bibliothèque de morceaux…</option>
          </select>

          <label class="toggle annotation-toggle" title="Afficher la notation">
            <input
              type="checkbox"
              id="notationToggle"
              class="visually-hidden"
              aria-label="Afficher la notation"
            />
            <svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9 18V5l10-2v13" />
              <circle cx="6" cy="18" r="3" />
              <circle cx="16" cy="16" r="3" />
            </svg>
          </label>

          <label class="speed" title="Vitesse de lecture">
            <svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3.34 19a10 10 0 1 1 17.32 0M12 15l4-4" />
            </svg>
            <input
              type="range"
              id="speedRange"
              class="speed-range"
              aria-label="Vitesse de lecture"
              min="0.25"
              max="2"
              step="0.05"
              value="1"
            />
            <span id="speedValue" class="speed-value">1×</span>
          </label>

          <!-- Entrée du sous-mode Travail (feature 06). Le mode Morceau reste
               un lecteur tant que ce bouton n'est pas activé. -->
          <button
            id="practiceToggle"
            class="btn practice-toggle"
            type="button"
            aria-pressed="false"
            aria-label="Travailler un passage"
            title="Travailler un passage"
          >
            <svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M17 2l4 4-4 4" />
              <path d="M3 11v-1a4 4 0 0 1 4-4h14" />
              <path d="M7 22l-4-4 4-4" />
              <path d="M21 13v1a4 4 0 0 1-4 4H3" />
            </svg>
            <span class="practice-toggle-label">Travail</span>
          </button>
        </div>

        <!-- Barre de transport : lecture / curseur de position -->
        <div class="transport">
          <button id="playBtn" class="btn play-btn" aria-label="Lecture / Pause">
            ▶
          </button>
          <span id="timeLabel" class="time-label">0:00 / 0:00</span>
          <input
            id="seek"
            class="seek"
            type="range"
            min="0"
            max="0"
            step="0.01"
            value="0"
          />
        </div>

        <!-- =================================================================
             Sous-mode Travail : passages, main travaillée, boucle, attente et
             tempo de travail (plan/06 § 10). Cette ligne n'apparaît que
             lorsque le bouton Travail est enfoncé : l'écran de lecture simple
             ne doit pas en être surchargé.
             ============================================================== -->
        <div id="practiceBar" class="practice-bar" hidden>
          <div class="practice-group">
            <select
              id="practiceSection"
              class="song-select practice-select"
              aria-label="Passage travaillé"
            >
              <option value="">Morceau entier</option>
            </select>
            <button id="practiceAdd" class="btn icon-btn" type="button"
              aria-label="Nouveau passage" title="Nouveau passage à la position actuelle">+</button>
            <button id="practiceRename" class="btn icon-btn" type="button"
              aria-label="Renommer le passage" title="Renommer le passage">✎</button>
            <button id="practiceDelete" class="btn icon-btn" type="button"
              aria-label="Supprimer le passage" title="Supprimer le passage">✕</button>
          </div>

          <div class="practice-group">
            <!-- En petite largeur, seule la flèche reste : deux libellés de
                 plus feraient une ligne de plus, prise sur le rouleau. -->
            <button id="practiceMarkStart" class="btn practice-btn" type="button"
              aria-label="Placer le début du passage à la position actuelle"
              title="Placer le début du passage à la position actuelle"
            ><span aria-hidden="true">⇤</span><span class="practice-btn-label">Début ici</span></button>
            <button id="practiceMarkEnd" class="btn practice-btn" type="button"
              aria-label="Placer la fin du passage à la position actuelle"
              title="Placer la fin du passage à la position actuelle"
            ><span aria-hidden="true">⇥</span><span class="practice-btn-label">Fin ici</span></button>
          </div>

          <div class="practice-group" role="group" aria-label="Main travaillée">
            <button class="btn practice-btn practice-hand" data-hand="left" type="button"
              aria-pressed="false" title="Travailler la main gauche">MG</button>
            <button class="btn practice-btn practice-hand" data-hand="both" type="button"
              aria-pressed="true" title="Travailler les deux mains">2 mains</button>
            <button class="btn practice-btn practice-hand" data-hand="right" type="button"
              aria-pressed="false" title="Travailler la main droite">MD</button>
          </div>

          <div class="practice-group">
            <button id="practiceAccompany" class="btn practice-btn practice-switch" type="button"
              aria-pressed="true" title="Jouer l'autre main en accompagnement">Accomp.</button>
            <button id="practiceLoop" class="btn practice-btn practice-switch" type="button"
              aria-pressed="true" title="Répéter le passage en boucle">Boucle</button>
            <button id="practiceWait" class="btn practice-btn practice-switch" type="button"
              aria-pressed="false" title="Attendre la bonne note avant de continuer">Attente</button>
          </div>

          <div class="practice-group practice-tempo">
            <button id="practiceTempoDown" class="btn icon-btn" type="button"
              aria-label="Tempo de travail : moins 5 %">−</button>
            <span id="practiceTempoValue" class="practice-tempo-value">100 %</span>
            <button id="practiceTempoUp" class="btn icon-btn" type="button"
              aria-label="Tempo de travail : plus 5 %">+</button>
          </div>

          <div class="practice-status">
            <span id="practiceStatusText" class="practice-status-text" role="status"></span>
            <button id="practiceApplyTempo" class="btn practice-btn practice-suggest"
              type="button" hidden></button>
          </div>
        </div>
      </div>
    </header>

    <!-- Scène : l'écran d'accueil ou la fonctionnalité active y est rendue. -->
    <main class="stage" id="stage"></main>
    </div>

    <!-- @tonejs/midi pour parser les fichiers .mid, + logique applicative -->
    <script type="module" src="src/main.js"></script>
  </body>
</html>
