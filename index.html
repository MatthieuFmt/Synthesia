<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Synthesia Web — Apprentissage du piano</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">

      <div class="controls">
        <label
          class="file-btn icon-btn"
          title="Charger un fichier MIDI"
        >
          <svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 16V4m0 0L8 8m4-4 4 4M5 14v5h14v-5" />
          </svg>
          <span class="visually-hidden">Charger un fichier MIDI</span>
          <input type="file" id="midiInput" accept=".mid,.midi" hidden />
        </label>

        <select id="songSelect" class="song-select">
          <option value="">Bibliothèque de morceaux…</option>
        </select>

        <label class="toggle annotation-toggle" title="Afficher la notation">
          <input
            type="checkbox"
            id="notationToggle"
            class="visually-hidden"
            aria-label="Afficher la notation"
            checked
          />
          <svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 18V5l10-2v13" />
            <circle cx="6" cy="18" r="3" />
            <circle cx="16" cy="16" r="3" />
          </svg>
        </label>

        <label class="speed" title="Vitesse de lecture">
          <svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3.34 19a10 10 0 1 1 17.32 0M12 15l4-4" />
          </svg>
          <input
            type="range"
            id="speedRange"
            class="speed-range"
            aria-label="Vitesse de lecture"
            min="0.25"
            max="2"
            step="0.05"
            value="1"
          />
          <span id="speedValue" class="speed-value">1×</span>
        </label>

      </div>

      <!-- Barre de transport : lecture / curseur de position -->
      <div class="transport">
        <button id="playBtn" class="btn play-btn" aria-label="Lecture / Pause">
          ▶
        </button>
        <span id="timeLabel" class="time-label">0:00 / 0:00</span>
        <input
          id="seek"
          class="seek"
          type="range"
          min="0"
          max="0"
          step="0.01"
          value="0"
        />
        <button
          id="fullscreenBtn"
          class="btn fullscreen-btn"
          type="button"
          aria-label="Passer en plein écran"
          title="Passer en plein écran"
        >
          <svg
            class="fullscreen-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path d="M8 3H3v5M16 3h5v5M21 16v5h-5M8 21H3v-5" />
          </svg>
        </button>
      </div>
    </header>

    <main class="stage">
      <!-- Canvas principal : grille de repères + notes -->
      <canvas id="rollCanvas"></canvas>
      <div class="hint">
        Molette / glisser pour défiler · cliquez les touches du clavier pour
        jouer
      </div>
    </main>

    <!-- @tonejs/midi pour parser les fichiers .mid, + logique applicative -->
    <script type="module" src="src/main.js"></script>
  </body>
</html>
