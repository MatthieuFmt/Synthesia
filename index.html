<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Synthesia Web — Apprentissage du piano</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">

      <div class="controls">
        <label class="file-btn">
          Charger un fichier MIDI
          <input type="file" id="midiInput" accept=".mid,.midi" hidden />
        </label>

        <select id="songSelect" class="song-select">
          <option value="">Bibliothèque de morceaux…</option>
        </select>

        <label class="toggle">
          <input type="checkbox" id="notationToggle" checked />
          Notation
        </label>

        <label class="speed">
          Vitesse
          <input
            type="range"
            id="speedRange"
            class="speed-range"
            min="0.25"
            max="2"
            step="0.05"
            value="1"
          />
          <span id="speedValue" class="speed-value">1×</span>
        </label>

      </div>

      <!-- Barre de transport : lecture / curseur de position -->
      <div class="transport">
        <button id="playBtn" class="btn play-btn" aria-label="Lecture / Pause">
          ▶
        </button>
        <span id="timeLabel" class="time-label">0:00 / 0:00</span>
        <input
          id="seek"
          class="seek"
          type="range"
          min="0"
          max="0"
          step="0.01"
          value="0"
        />
        <button
          id="fullscreenBtn"
          class="btn fullscreen-btn"
          type="button"
          aria-label="Passer en plein écran"
          title="Passer en plein écran"
        >
          <svg
            class="fullscreen-icon fullscreen-enter-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path d="M8 3H3v5M16 3h5v5M21 16v5h-5M8 21H3v-5" />
          </svg>
          <svg
            class="fullscreen-icon fullscreen-exit-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
            hidden
          >
            <path d="M3 8h5V3M21 8h-5V3M16 21v-5h5M8 21v-5H3" />
          </svg>
        </button>
      </div>
    </header>

    <main class="stage">
      <!-- Canvas principal : grille de repères + notes -->
      <canvas id="rollCanvas"></canvas>
      <div class="hint">
        Molette / glisser pour défiler · cliquez les touches du clavier pour
        jouer
      </div>
    </main>

    <!-- @tonejs/midi pour parser les fichiers .mid, + logique applicative -->
    <script type="module" src="src/main.js"></script>
  </body>
</html>
