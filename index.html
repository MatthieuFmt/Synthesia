<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Synthesia Web — Apprentissage du piano</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Conteneur pivotable : sert de cible à la rotation CSS du mode paysage
         de secours (cf. body.force-landscape dans style.css). -->
    <div class="app">
    <header class="topbar">
      <!-- =====================================================================
           Barre commune : présente quelle que soit la fonctionnalité active
           (retour à l'accueil, nom du mode, paysage, plein écran).
           ================================================================== -->
      <div class="appbar">
        <button id="homeBtn" class="btn home-btn" type="button" hidden
          aria-label="Revenir à l'accueil" title="Revenir à l'accueil">
          <svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19 12H5m0 0 6-6m-6 6 6 6" />
          </svg>
          <span class="home-btn-label">Accueil</span>
        </button>

        <span id="featureTitle" class="feature-title">Accueil</span>

        <button id="landscapeBtn" class="btn icon-btn landscape-btn" type="button"
          aria-label="Passer en mode paysage" title="Passer en mode paysage">
          <svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M23 4v6h-6" />
            <path d="M20.5 15a9 9 0 1 1 2.2-9.5" />
          </svg>
        </button>

        <button
          id="fullscreenBtn"
          class="btn fullscreen-btn"
          type="button"
          aria-label="Passer en plein écran"
          title="Passer en plein écran"
        >
          <svg
            class="fullscreen-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path d="M8 3H3v5M16 3h5v5M21 16v5h-5M8 21H3v-5" />
          </svg>
        </button>
      </div>

      <!-- =====================================================================
           Contrôles propres au mode Morceau : bibliothèque, notation, vitesse
           et transport. Affichés par song-mode.js pendant que le mode est
           actif, masqués dès son arrêt.
           ================================================================== -->
      <div id="songControls" class="mode-controls" hidden>
        <div class="controls">
          <select id="songSelect" class="song-select">
            <option value="">Bibliothèque de morceaux…</option>
          </select>

          <label class="toggle annotation-toggle" title="Afficher la notation">
            <input
              type="checkbox"
              id="notationToggle"
              class="visually-hidden"
              aria-label="Afficher la notation"
            />
            <svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9 18V5l10-2v13" />
              <circle cx="6" cy="18" r="3" />
              <circle cx="16" cy="16" r="3" />
            </svg>
          </label>

          <label class="speed" title="Vitesse de lecture">
            <svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3.34 19a10 10 0 1 1 17.32 0M12 15l4-4" />
            </svg>
            <input
              type="range"
              id="speedRange"
              class="speed-range"
              aria-label="Vitesse de lecture"
              min="0.25"
              max="2"
              step="0.05"
              value="1"
            />
            <span id="speedValue" class="speed-value">1×</span>
          </label>
        </div>

        <!-- Barre de transport : lecture / curseur de position -->
        <div class="transport">
          <button id="playBtn" class="btn play-btn" aria-label="Lecture / Pause">
            ▶
          </button>
          <span id="timeLabel" class="time-label">0:00 / 0:00</span>
          <input
            id="seek"
            class="seek"
            type="range"
            min="0"
            max="0"
            step="0.01"
            value="0"
          />
        </div>
      </div>
    </header>

    <!-- Scène : l'écran d'accueil ou la fonctionnalité active y est rendue. -->
    <main class="stage" id="stage"></main>
    </div>

    <!-- @tonejs/midi pour parser les fichiers .mid, + logique applicative -->
    <script type="module" src="src/main.js"></script>
  </body>
</html>
