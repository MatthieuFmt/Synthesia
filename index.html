<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Synthesia Web — Apprentissage du piano</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="titlebar">
        <h1>🎹 Synthesia Web</h1>
        <button id="landscapeBtn" class="btn landscape-btn" type="button">
          🔄 Mode paysage
        </button>
      </div>

      <div class="controls">
        <label class="file-btn">
          Charger un fichier MIDI
          <input type="file" id="midiInput" accept=".mid,.midi" hidden />
        </label>

        <select id="songSelect" class="song-select">
          <option value="">Bibliothèque de morceaux…</option>
        </select>

        <label class="toggle">
          <input type="checkbox" id="notationToggle" />
          Notation
        </label>

        <label class="speed">
          Vitesse
          <input
            type="range"
            id="speedRange"
            class="speed-range"
            min="0.25"
            max="2"
            step="0.05"
            value="1"
          />
          <span id="speedValue" class="speed-value">1×</span>
        </label>

        <div class="legend">
          <span class="legend-item"
            ><span class="swatch left-hand"></span>Main gauche</span
          >
          <span class="legend-item"
            ><span class="swatch right-hand"></span>Main droite</span
          >
        </div>
      </div>

      <!-- Barre de transport : lecture / curseur de position -->
      <div class="transport">
        <button id="playBtn" class="btn play-btn" aria-label="Lecture / Pause">
          ▶
        </button>
        <span id="timeLabel" class="time-label">0:00 / 0:00</span>
        <input
          id="seek"
          class="seek"
          type="range"
          min="0"
          max="0"
          step="0.01"
          value="0"
        />
      </div>

      <div id="songInfo" class="song-info">Aucun morceau chargé.</div>
    </header>

    <main class="stage">
      <!-- Canvas principal : grille de repères + notes -->
      <canvas id="rollCanvas"></canvas>
    </main>

    <!-- @tonejs/midi pour parser les fichiers .mid, + logique applicative -->
    <script type="module" src="src/main.js"></script>
  </body>
</html>
